<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Lesplanner | BijlesCedric</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;
    color:#173f70;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:480px;margin:20px;padding:30px;border-radius:18px;background:#fff;border:1px solid #d6e1ee}
    h1{margin-top:0}p{line-height:1.6}a{color:#235f9d}
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main><h1>BijlesCedric – lesplanner</h1>
    <p id="message">Je persoonlijke boekingslink wordt geopend…</p>
    <p><a href="/">Terug naar de website</a></p>
  </main>
  <script>
    (function(){
      const url = String(window.BIJLES_PLANNER_APP_URL || '');
      const params = new URLSearchParams(window.location.search);
      const key = params.get('k') || '';
      const admin = params.get('mode') === 'admin';
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
        document.getElementById('message').textContent =
          'De lesplanner is nog niet gekoppeld. Stel de deployment-URL in via plan-les/config.js.';
        return;
      }
      if (!admin && !/^[A-Za-z0-9_-]{16,100}$/.test(key)) {
        document.getElementById('message').textContent =
          'Deze link is niet geldig. Vraag Cedric om je persoonlijke boekingslink.';
        return;
      }
      const target = new URL(url);
      if (admin) {
        target.searchParams.set('mode','admin');
        const booking = params.get('booking') || '';
        if (/^[A-Za-z0-9_-]{16,100}$/.test(booking)) target.searchParams.set('booking',booking);
      } else {
        target.searchParams.set('k',key);
        const offer = params.get('offer') || '';
        if (/^[A-Za-z0-9_-]{16,100}$/.test(offer)) target.searchParams.set('offer',offer);
      }
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
